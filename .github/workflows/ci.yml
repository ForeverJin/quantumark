# 持续集成：日常提交只跑单元测试；打 v* 标签才构建二进制与镜像。
#
# 触发与产出：
#   - push 到 main / PR：只跑单元测试，不构建 Release、不推镜像
#   - 推送 v* 标签：测试通过后构建 Release 二进制，并推送 amd64 + arm64 镜像
#   - 手动触发：走标签的构建流程，镜像只打 sha-<commit>
#
# 镜像标签（tag 触发）：1.2.3 / 1.2 / 1 / sha-<commit> / latest
# 镜像位置：ghcr.io/<owner>/quantumark，使用仓库自带的 GITHUB_TOKEN，无需额外密钥。
# 首次推送后包默认是私有的，需要在仓库的 Packages 页面按需改成 public。

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      # 单元测试不联网，使用内存目的地（src/jobs/fake.rs）
      - name: 单元测试
        run: cargo test --locked

      # Release 构建与二进制只在打标签（或手动触发）时做
      - name: Release 构建
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: cargo build --release --locked

      - name: 上传二进制
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quantumark-linux-amd64
          path: target/release/quantumark
          if-no-files-found: error

  image:
    name: 构建并推送镜像
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dockerfile 在 BUILDPLATFORM 上交叉编译；只有 arm64 运行阶段的 apt 需要模拟
      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_BUILD_JOBS=4
          # scope 显式指定：构建被中途取消时可能留下损坏的 registry 缓存，
          # 换一个 scope（v2 → v3 …）即可让下一次构建从干净缓存开始。
          cache-from: type=gha,scope=quantumark-v2
          cache-to: type=gha,mode=max,scope=quantumark-v2
