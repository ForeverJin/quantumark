# 持续集成：编译、单元测试，并把多架构镜像推送到 GHCR。
#
# 触发与产出：
#   - push 到 main：跑测试，推送 latest / main / sha-<commit> 镜像
#   - 推送 v* 标签：额外推送 1.2.3、1.2 这类版本标签
#   - PR：只跑编译与测试，不推镜像
#   - 手动触发：workflow_dispatch
#
# 镜像位置：ghcr.io/<owner>/quantumark，使用仓库自带的 GITHUB_TOKEN，无需额外密钥。
# 首次推送后包默认是私有的，需要在仓库的 Packages 页面按需改成 public。

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: 编译与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      # 单元测试不联网，使用内存目的地（src/jobs/fake.rs）
      - name: 单元测试
        run: cargo test --locked

      - name: Release 构建
        run: cargo build --release --locked

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: quantumark-linux-amd64
          path: target/release/quantumark
          if-no-files-found: error

  image:
    name: 构建并推送镜像
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dockerfile 在 BUILDPLATFORM 上交叉编译；只有 arm64 运行阶段的 apt 需要模拟
      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max
