[package]
name = "quantumark"
version = "0.1.3"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8"
bytes = "1.12.2"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
cron = "0.17.0"
globset = "0.4.22"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = "1"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1"] }
prost = "0.14.6"
prost-types = "0.14.6"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "signal"] }
tokio-stream = "0.1.19"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.14.6"
protoc-bin-vendored = "3.3.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
tempfile = "3.27.0"
